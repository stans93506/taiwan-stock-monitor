name: 瘥?湔?啗??葫

on:
  schedule:
    - cron: '30 */2 * * *'  # 瘥撠??瑁?銝甈∴?UTC :30??嚗憭拙12甈?
  workflow_dispatch:
    # 銋隞亙 GitHub 蝬脤???閫貊

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ??蝔?蝣?
        uses: actions/checkout@v4

      - name: 閮剖? Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 摰?憟辣
        run: pip install -r requirements.txt

      - name: ?瑁???葫?單
        run: python fetch_revenue.py

      - name: 銴ˊ??index.html嚗? GitHub Pages 雿輻嚗?
        run: cp ?啗??葫.html index.html

      - name: 撠?啁???commit ??repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f index.html ?啗??葫.html *.json
          git diff --cached --quiet || git commit -m "?芸??湔嚗?(date '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main || true
          git push

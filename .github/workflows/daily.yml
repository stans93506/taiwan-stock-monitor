name: 每日更新台股監測

on:
  schedule:
    - cron: '30 16 * * *'  # 00:30 台灣時間
    - cron: '30 18 * * *'  # 02:30 台灣時間
    - cron: '30 20 * * *'  # 04:30 台灣時間
    - cron: '30 22 * * *'  # 06:30 台灣時間
    - cron: '30 0 * * *'   # 08:30 台灣時間
    - cron: '30 2 * * *'   # 10:30 台灣時間
    - cron: '30 4 * * *'   # 12:30 台灣時間
    - cron: '30 6 * * *'   # 14:30 台灣時間
    - cron: '30 8 * * *'   # 16:30 台灣時間
    - cron: '30 10 * * *'  # 18:30 台灣時間
    - cron: '30 12 * * *'  # 20:30 台灣時間
    - cron: '30 14 * * *'  # 22:30 台灣時間
  workflow_dispatch:
    # 也可以在 GitHub 網頁手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行監測腳本
        run: python fetch_revenue.py

      - name: 複製為 index.html（供 GitHub Pages 使用）
        run: cp 台股監測.html index.html

      - name: 將更新結果 commit 回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f index.html 台股監測.html *.json
          git diff --cached --quiet || git commit -m "自動更新：$(date '+%Y-%m-%d %H:%M') UTC"
          git push

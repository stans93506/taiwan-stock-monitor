name: 每日更新台股監測

on:
  workflow_dispatch:
    # 由 cron-job.org 外部觸發，精準控制執行時間

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行監測腳本
        run: python fetch_revenue.py

      - name: 複製為 index.html（供 GitHub Pages 使用）
        run: cp 台股監測.html index.html

      - name: 將更新結果 commit 回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f index.html 台股監測.html *.json
          git diff --cached --quiet || git commit -m "自動更新：$(date '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main || true
          git push
